<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f22"/>
      <stop offset="1" stop-color="#0c0f1a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.5" stop-color="#b57bff"/>
      <stop offset="1" stop-color="#36d8ff"/>
      <animate attributeName="x1" values="0;0.3;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.3;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="340" rx="24"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <!-- colorful glow blobs -->
    <g filter="url(#soft)" opacity="0.55">
      <circle cx="170" cy="90" r="120" fill="#ff4fa3">
        <animate attributeName="cy" values="90;130;90" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="250" r="140" fill="#28e0ff">
        <animate attributeName="cy" values="250;210;250" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="60" r="110" fill="#ffd166">
        <animate attributeName="cx" values="980;1030;980" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="300" r="120" fill="#64ffb4">
        <animate attributeName="cx" values="320;270;320" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- content -->
    <text x="80" y="150" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#name)">Rajesh Renato</text>
    <text x="84" y="196" font-size="24" font-weight="600" letter-spacing="6" fill="#8a93ad">THE&#160;&#160;PLAYGROUND</text>
    <text x="84" y="236" font-size="22" font-weight="500" fill="#c6cde0">100+ games, tools &amp; toys that run straight in your browser.</text>

    <!-- colorful tag pills -->
    <g font-size="17" font-weight="600">
      <g transform="translate(84,268)">
        <rect width="168" height="38" rx="19" fill="#ff4fa3" opacity="0.16"/><rect width="168" height="38" rx="19" fill="none" stroke="#ff4fa3" stroke-opacity="0.5"/>
        <text x="84" y="25" fill="#ff86bd" text-anchor="middle">browser games</text>
      </g>
      <g transform="translate(266,268)">
        <rect width="152" height="38" rx="19" fill="#28e0ff" opacity="0.14"/><rect width="152" height="38" rx="19" fill="none" stroke="#28e0ff" stroke-opacity="0.5"/>
        <text x="76" y="25" fill="#7fe9ff" text-anchor="middle">private tools</text>
      </g>
      <g transform="translate(432,268)">
        <rect width="138" height="38" rx="19" fill="#64ffb4" opacity="0.14"/><rect width="138" height="38" rx="19" fill="none" stroke="#64ffb4" stroke-opacity="0.5"/>
        <text x="69" y="25" fill="#8fffcb" text-anchor="middle">no server</text>
      </g>
      <g transform="translate(584,268)">
        <rect width="158" height="38" rx="19" fill="#ffd166" opacity="0.16"/><rect width="158" height="38" rx="19" fill="none" stroke="#ffd166" stroke-opacity="0.5"/>
        <text x="79" y="25" fill="#ffdf8f" text-anchor="middle">from scratch</text>
      </g>
    </g>

    <!-- playful color squares, a nod to the matrix -->
    <g transform="translate(1012,96)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#e0384c"/>
      <rect x="76" y="0" width="64" height="64" rx="14" fill="#10a866"/>
      <rect x="0" y="76" width="64" height="64" rx="14" fill="#d9860a"/>
      <rect x="76" y="76" width="64" height="64" rx="14" fill="#6d55f7"/>
      <animateTransform attributeName="transform" type="rotate" values="0 1082 166;3 1082 166;0 1082 166;-3 1082 166;0 1082 166" dur="8s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>
</svg>
